<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECG Signal Viewer</title>
    <script src="https://cdn.plot.ly/plotly-2.26.0.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Additional styles for controls */
        .ctrl-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 15px;
            padding: 10px;
            background: #1a1f2e;
            border: 1px solid #2a2f3e;
            border-radius: 8px;
        }

        .ctrl-btn {
            background: #2a2f3e;
            border: 1px solid #3a4050;
            color: #e0e8ff;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .ctrl-btn:hover {
            background: #3a4050;
            border-color: #4a9eff;
        }

        .ctrl-btn.active {
            background: #4a9eff;
            border-color: #4a9eff;
            color: white;
        }

        .ctrl-btn.playing {
            background: #ef4444;
            border-color: #ef4444;
        }

        .ctrl-btn.paused {
            background: #4a9eff;
            border-color: #4a9eff;
        }

        .viewer-grid {
            display: grid;
            grid-template-columns: 3fr 1fr;
            gap: 20px;
        }

        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .channel-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .channel-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px;
            background: #1a1f2e;
            border-radius: 5px;
            margin-bottom: 4px;
            border-left: 3px solid;
        }

        .channel-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .channel-item input[type="color"] {
            width: 25px;
            height: 25px;
            border: 1px solid #3a4050;
            border-radius: 4px;
            cursor: pointer;
        }

        .channel-item input[type="range"] {
            width: 50px;
        }

        .ch-label {
            flex: 1;
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .plot-container {
            background: #1a1f2e;
            border: 1px solid #2a2f3e;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .plot-title {
            font-size: 12px;
            font-weight: 600;
            color: #8a9ab0;
            text-transform: uppercase;
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 1px solid #2a2f3e;
        }

        .model-status {
            background: #1a1f2e;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid #2a2f3e;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .model-badge {
            display: inline-block;
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .badge-loaded {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border: 1px solid #10b981;
        }

        .badge-fallback {
            background: rgba(245, 158, 11, 0.2);
            color: #f59e0b;
            border: 1px solid #f59e0b;
        }

        .upload-area {
            border: 2px dashed #3a4a6b;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #0f1422;
            margin-bottom: 20px;
        }

        .upload-area:hover {
            border-color: #4a9eff;
            background: #1a1f30;
        }

        .upload-area.dragover {
            border-color: #4a9eff;
            background: #1a1f30;
        }

        .tabs {
            display: flex;
            gap: 2px;
            margin-bottom: 20px;
            border-bottom: 1px solid #2a2f3e;
            padding-bottom: 1px;
        }

        .tab-btn {
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            color: #8a9ab0;
            padding: 10px 18px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .tab-btn:hover {
            color: #e0e0e0;
            background: #1a1f2e;
        }

        .tab-btn.active {
            color: #4a9eff;
            border-bottom-color: #4a9eff;
            background: #1a1f2e;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(8, 13, 24, 0.9);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 15px;
            z-index: 9999;
        }

        .loading-overlay.active {
            display: flex;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #2a2f3e;
            border-top-color: #4a9eff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .notif-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .notif {
            padding: 12px 20px;
            border-radius: 8px;
            color: white;
            font-size: 13px;
            animation: slideIn 0.3s ease;
            max-width: 300px;
        }

        .notif.success {
            background: #10b981;
        }

        .notif.error {
            background: #ef4444;
        }

        .notif.info {
            background: #4a9eff;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes slideOut {
            to {
                transform: translateX(100%);
                opacity: 0;
            }
        }

        .dx-card {
            background: #1a1f2e;
            border: 1px solid #2a2f3e;
            border-radius: 10px;
            padding: 15px;
        }

        .dx-normal {
            border-left: 4px solid #10b981;
        }

        .dx-abnormal {
            border-left: 4px solid #ef4444;
        }

        .dx-label {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .conf-bar-wrap {
            margin: 10px 0;
        }

        .conf-bar {
            height: 6px;
            background: #2a2f3e;
            border-radius: 3px;
            overflow: hidden;
        }

        .conf-bar-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        .dx-meta {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .dx-meta-item {
            background: #0f1422;
            border-radius: 6px;
            padding: 8px;
        }

        .dx-meta-item small {
            color: #8a9ab0;
            font-size: 10px;
            display: block;
            margin-bottom: 3px;
        }

        .classic-card {
            background: #0f1422;
            border: 1px solid #2a2f3e;
            border-radius: 10px;
            padding: 12px;
        }

        .hidden {
            display: none !important;
        }

        #mainPlot {
            min-height: 400px;
            width: 100%;
        }

        #syncMatrixPlot {
            min-height: 300px;
            width: 100%;
        }

        select, input[type="number"] {
            background: #0f1422;
            color: #e0e8ff;
            border: 1px solid #2a2f3e;
            padding: 5px 8px;
            border-radius: 4px;
            font-size: 12px;
        }

        label {
            color: #8a9ab0;
            font-size: 12px;
        }

        .demo-bar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 20px;
            padding: 10px;
            background: #1a1f2e;
            border-radius: 8px;
        }

        .demo-btn {
            background: #2a2f3e;
            border: 1px solid #3a4050;
            color: #e0e8ff;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }

        .demo-btn:hover {
            background: #3a4050;
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <span>Processing...</span>
    </div>

    <div id="notifContainer" class="notif-container"></div>

    <div class="container" style="max-width: 1400px; margin: 0 auto; padding: 20px;">
        <div class="header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h1 style="color: #4a9eff;">❤️ ECG Signal Viewer</h1>
            <button class="back-btn" onclick="window.location.href='index.html'" style="background: #2a4a6a; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer;">← Back</button>
        </div>

        <div class="model-status" id="modelStatusBar">
            <span>AI Model Status:</span>
            <span id="modelStatus" class="model-badge badge-fallback">Checking...</span>
        </div>

        <div class="upload-area" id="uploadArea">
            <input type="file" id="fileInput" accept=".csv,.edf,.bdf,.mat,.hea,.dat,.txt" style="display:none">
            <div class="upload-icon">📊</div>
            <h2>Upload ECG File</h2>
            <p>Supported: CSV, EDF, BDF, MAT, HEA, DAT, TXT</p>
            <p class="click-hint">Click anywhere or drag & drop</p>
        </div>

<!--        <div class="demo-bar" id="demoBar">-->
<!--            <span>Demo signals:</span>-->
<!--            <button class="demo-btn" data-type="normal">Normal</button>-->
<!--            <button class="demo-btn" data-type="afib">AFib</button>-->
<!--            <button class="demo-btn" data-type="vtach">VTach</button>-->
<!--            <button class="demo-btn" data-type="pvc">PVC</button>-->
<!--            <button class="demo-btn" data-type="brady">Brady</button>-->
<!--            <button class="demo-btn" data-type="tachy">Tachy</button>-->
<!--        </div>-->

        <div class="tabs" id="tabsContainer" style="display:none">
            <button class="tab-btn active" id="tabChannels">📊 Channels</button>
            <button class="tab-btn" id="tabXOR">⊕ XOR Graph</button>
            <button class="tab-btn" id="tabPolar">🌀 Polar</button>
            <button class="tab-btn" id="tabRecurrence">🔁 Recurrence</button>
            <button class="tab-btn" id="tabFFT">📈 FFT</button>
        </div>

        <div id="contentArea"></div>
        <div id="mainContent" class="hidden"></div>
    </div>

    <!-- Load scripts in correct order -->
    <script src="js/signalParser.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/visualizations.js"></script>
    <script src="js/ecg.js"></script>
</body>
</html>
