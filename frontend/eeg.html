<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EEG Signal Viewer</title>
    <script src="https://cdn.plot.ly/plotly-2.26.0.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <span>Processing...</span>
    </div>

    <div id="notifContainer" class="notif-container"></div>

    <div class="container">
        <div class="header">
            <h1>🧠 EEG Signal Viewer</h1>
            <button class="back-btn" onclick="window.location.href='index.html'">← Back</button>
        </div>

        <div class="model-status">
            <span>AI Model Status:</span>
            <span id="modelStatus" class="model-badge badge-fallback">Checking...</span>
            <div class="abnormalities-list">
                <span class="abnormality-badge badge-normal">Normal</span>
                <span class="abnormality-badge badge-epilepsy">Epilepsy</span>
                <span class="abnormality-badge badge-slow">Slow Waves</span>
                <span class="abnormality-badge badge-asymmetry">Asymmetry</span>
            </div>
        </div>

        <div class="upload-area" id="uploadArea">
            <input type="file" id="fileInput" accept=".csv,.edf,.bdf,.mat,.hea,.dat,.txt" style="display:none">
            <div class="upload-icon">📊</div>
            <h2>Upload EEG File</h2>
            <p>Supported: CSV, EDF, BDF, MAT, HEA, DAT, TXT</p>
            <p class="click-hint">Click anywhere or drag & drop</p>
        </div>

<!--        <div class="demo-bar">-->
<!--            <span>Demo signals:</span>-->
<!--            <button class="demo-btn" data-type="normal">Normal</button>-->
<!--            <button class="demo-btn" data-type="epilepsy">Epilepsy</button>-->
<!--            <button class="demo-btn" data-type="slow">Slow Waves</button>-->
<!--            <button class="demo-btn" data-type="asymmetry">Asymmetry</button>-->
<!--        </div>-->

        <div class="tabs" id="tabsContainer" style="display:none">
            <button class="tab-btn active" id="tabChannels">📊 Channels</button>
            <button class="tab-btn" id="tabXOR">⊕ XOR Graph</button>
            <button class="tab-btn" id="tabPolar">🌀 Polar</button>
            <button class="tab-btn" id="tabRecurrence">🔁 Recurrence</button>
            <button class="tab-btn" id="tabFFT">📈 FFT</button>
        </div>

        <div id="contentArea"></div>
    </div>

    <!-- Load scripts in correct order -->
    <script src="js/signalParser.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/visualizations.js"></script>
    <script src="js/app.js"></script>
    <script src="js/eeg.js"></script>
</body>
</html>
